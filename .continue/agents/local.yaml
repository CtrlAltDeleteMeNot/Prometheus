name: Prometheus Config
version: 1.0.0
schema: v1

models:
  - name: Main
    provider: ollama
    model: qwen3-coder:30b 
    roles:
      - chat
  
  - name: Edit
    provider: ollama
    model: deepseek-coder:6.7b
    roles:
      - edit

  - name: Apply
    provider: ollama
    model: deepseek-coder:6.7b
    roles:
      - apply
  
  - name: Fast Autocomplete
    provider: ollama
    model: qwen2.5-coder:3b
    roles:
      - autocomplete

  - name: Nomic Embed
    provider: ollama
    model: nomic-embed-text:latest
    roles:
      - embed

rules:
  - Give concise responses
  - Always assume TypeScript rather than JavaScript
  - Talk like a pirate
  - Do not output markdown